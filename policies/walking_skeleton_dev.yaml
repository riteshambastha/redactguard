# Walking-skeleton development policy (NOT for production use)
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

version: 1
name: "walking_skeleton_dev"
description: >
  Development-only policy. Each PII type now has two independent
  detectors (face: Haar + LBP cascade; text: Tesseract OCR + MSER region
  proposal; audio: faster-whisper + energy VAD - see docs/adr/0008), so
  the real profiles (policies/gdpr_v1.yaml etc.) use the default
  agreement_threshold=2. This dev policy keeps agreement_threshold=1
  purely for fast local iteration against a single detector at a time
  (e.g. while testing a new plugin) without needing a second detector to
  also fire on the same synthetic test clip.

pii_types:
  face:
    enabled: true
  text:
    enabled: true
  audio:
    enabled: true

agreement_threshold: 1

custom_keywords: []

retry:
  max_attempts: 3
  escalation: "lower_threshold_and_widen_margin"
  on_unresolved: "warn"

