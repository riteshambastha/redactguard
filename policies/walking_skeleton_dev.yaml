# Walking-skeleton development policy (NOT for production use)
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

version: 1
name: "walking_skeleton_dev"
description: >
  Development-only policy for the walking-skeleton phase (see the
  build-plan log). All three PII types now have exactly one detector each
  (Haar-cascade face, Tesseract OCR text, faster-whisper audio).
  agreement_threshold is 1 because none of them have a second, independent
  detector yet - real ensemble voting (docs/adr/0001) needs that before
  this moves to the default threshold of 2.

pii_types:
  face:
    enabled: true
  text:
    enabled: true
  audio:
    enabled: true

agreement_threshold: 1

custom_keywords: []

retry:
  max_attempts: 3
  escalation: "lower_threshold_and_widen_margin"
  on_unresolved: "warn"

