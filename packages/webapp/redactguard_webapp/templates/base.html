<!-- RedactGuard | Author: Ritesh Ambastha -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RedactGuard{% endblock %}</title>
{% block extra_head %}{% endblock %}
<style>
  :root {
    color-scheme: light dark;
    --color-bg: #f7f7fb;
    --color-surface: #ffffff;
    --color-border: rgba(15, 17, 26, 0.10);
    --color-border-strong: rgba(15, 17, 26, 0.18);
    --color-text: #14161f;
    --color-text-muted: #666b7a;
    --color-primary: #4f46e5;
    --color-primary-hover: #4338ca;
    --color-primary-soft: rgba(79, 70, 229, 0.08);
    --color-primary-ring: rgba(79, 70, 229, 0.18);
    --color-success-text: #0f7a4d;
    --color-success-bg: rgba(15, 122, 77, 0.12);
    --color-info-text: #1d5fb4;
    --color-info-bg: rgba(29, 95, 180, 0.12);
    --color-warn-text: #9a6300;
    --color-warn-bg: rgba(154, 99, 0, 0.14);
    --color-danger-text: #b3261e;
    --color-danger-bg: rgba(179, 38, 30, 0.10);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 1px 2px rgba(15, 17, 26, 0.04), 0 8px 24px -12px rgba(15, 17, 26, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #0f1115;
      --color-surface: #171922;
      --color-border: rgba(255, 255, 255, 0.10);
      --color-border-strong: rgba(255, 255, 255, 0.20);
      --color-text: #eceef3;
      --color-text-muted: #9aa0b2;
      --color-primary: #818cf8;
      --color-primary-hover: #a5b0fb;
      --color-primary-soft: rgba(129, 140, 248, 0.14);
      --color-primary-ring: rgba(129, 140, 248, 0.28);
      --color-success-text: #4ade80;
      --color-success-bg: rgba(74, 222, 128, 0.14);
      --color-info-text: #7dd3fc;
      --color-info-bg: rgba(125, 211, 252, 0.14);
      --color-warn-text: #fbbf24;
      --color-warn-bg: rgba(251, 191, 36, 0.14);
      --color-danger-text: #fca5a5;
      --color-danger-bg: rgba(252, 165, 165, 0.14);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 3rem;
    line-height: 1.55; color: var(--color-text); background: var(--color-bg);
  }
  a { color: var(--color-primary); text-decoration: none; }
  a:hover { color: var(--color-primary-hover); text-decoration: underline; }
  h2 { font-size: 1.15rem; margin: 0 0 0.9rem; }
  h3 { font-size: 0.95rem; margin: 1.4rem 0 0.6rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.03em; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2rem; flex-wrap: wrap; gap: 0.75rem; padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--color-border);
  }
  header h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  header h1 a { color: var(--color-text); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }
  header h1 a::before {
    content: "\1F6E1"; /* shield emoji doubles as a placeholder mark - no image assets needed */
    font-size: 1.1rem;
  }
  nav { display: flex; align-items: center; gap: 1.1rem; }
  nav a { color: var(--color-text-muted); font-weight: 500; }
  nav a:hover { color: var(--color-primary); text-decoration: none; }
  nav form { display: inline; margin: 0; }
  nav button {
    background: none; border: 1px solid var(--color-border-strong); color: var(--color-text-muted);
    border-radius: var(--radius-sm); padding: 0.35rem 0.75rem; font-size: 0.9rem; cursor: pointer;
  }
  nav button:hover { border-color: var(--color-primary); color: var(--color-primary); }

  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 1.4rem 1.6rem; margin-bottom: 1.5rem;
    box-shadow: var(--shadow-card);
  }
  .card-narrow { max-width: 420px; margin-left: auto; margin-right: auto; }
  .dashboard-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .dashboard-heading h2 { margin: 0; }
  .btn-link {
    display: inline-block; font-weight: 600; font-size: 0.88rem; padding: 0.4rem 0.9rem;
    border-radius: var(--radius-sm); background: var(--color-primary); color: white;
  }
  .btn-link:hover { background: var(--color-primary-hover); color: white; text-decoration: none; }
  .error { color: var(--color-danger-text); background: var(--color-danger-bg); border-radius: var(--radius-sm); padding: 0.6rem 0.85rem; }
  .warn { color: var(--color-warn-text); background: var(--color-warn-bg); border-radius: var(--radius-sm); padding: 0.75rem 1rem; }
  .muted { color: var(--color-text-muted); font-size: 0.9rem; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 0.5rem 0.6rem; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--color-text-muted); border-bottom: 1px solid var(--color-border-strong);
  }
  td { padding: 0.65rem 0.6rem; border-bottom: 1px solid var(--color-border); }
  tbody tr:hover { background: var(--color-primary-soft); }

  .status-queued, .status-running, .status-done, .status-failed {
    display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600;
    font-size: 0.82rem; padding: 0.15rem 0.6rem; border-radius: 999px;
  }
  .status-queued { color: var(--color-text-muted); background: rgba(128,128,128,0.14); }
  .status-running { color: var(--color-info-text); background: var(--color-info-bg); }
  .status-done { color: var(--color-success-text); background: var(--color-success-bg); }
  .status-failed { color: var(--color-danger-text); background: var(--color-danger-bg); }

  form label { display: block; margin-top: 1.1rem; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.92rem; }
  input[type=email], input[type=password], input[type=file], select {
    width: 100%; padding: 0.55rem 0.7rem; box-sizing: border-box;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-text); font-size: 0.95rem;
  }
  input[type=email]:focus, input[type=password]:focus, input[type=file]:focus, select:focus {
    outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-ring);
  }
  button[type=submit] {
    margin-top: 1.5rem; padding: 0.6rem 1.3rem; cursor: pointer; font-size: 0.95rem; font-weight: 600;
    color: white; background: var(--color-primary); border: none; border-radius: var(--radius-sm);
    transition: background 0.15s ease;
  }
  button[type=submit]:hover { background: var(--color-primary-hover); }

  .policy-picker { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.4rem; }
  .policy-card {
    display: flex; gap: 0.75rem; align-items: flex-start; cursor: pointer;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius);
    padding: 0.9rem 1.1rem; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .policy-card:hover { border-color: var(--color-primary); }
  .policy-card input[type=radio] { margin-top: 0.3rem; accent-color: var(--color-primary); flex-shrink: 0; }
  .policy-card:has(input:checked) {
    border-color: var(--color-primary); background: var(--color-primary-soft);
    box-shadow: 0 0 0 3px var(--color-primary-ring);
  }
  .policy-card-body { display: flex; flex-direction: column; gap: 0.3rem; }
  .policy-card-heading { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; }
  .policy-card-title { font-weight: 600; }
  .policy-card-tagline { color: var(--color-text-muted); font-size: 0.9rem; }
  .policy-card-details { margin: 0.35rem 0 0; padding-left: 1.15rem; font-size: 0.85rem; color: var(--color-text-muted); }
  .policy-card-details li { margin-bottom: 0.15rem; }

  .badge {
    display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 0.1rem 0.55rem;
    border-radius: 999px; white-space: nowrap;
  }
  .badge-offline { color: var(--color-success-text); background: var(--color-success-bg); }
  .badge-online { color: var(--color-warn-text); background: var(--color-warn-bg); }

  pre.report { white-space: pre-wrap; background: var(--color-primary-soft); padding: 0.9rem 1rem; border-radius: var(--radius-sm); font-size: 0.88rem; }
  pre.progress-log { max-height: 320px; overflow-y: auto; font-size: 0.83rem; background: rgba(128,128,128,0.08); }

  footer { margin-top: 2.5rem; font-size: 0.82rem; color: var(--color-text-muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1><a href="/">RedactGuard</a></h1>
  <nav>
    {% if user %}
      <span class="muted">{{ user["email"] }}</span>
      <a href="/dashboard">Dashboard</a>
      <a href="/upload">New job</a>
      <form action="/logout" method="post"><button type="submit">Log out</button></form>
    {% else %}
      <a href="/login">Log in</a>
      <a href="/signup">Sign up</a>
    {% endif %}
  </nav>
</header>
{% block content %}{% endblock %}
<footer>
  RedactGuard — self-hosted, privacy-preserving video PII redaction.
  <a href="https://github.com/riteshambastha/redactguard">Source on GitHub</a>
</footer>
</body>
</html>
