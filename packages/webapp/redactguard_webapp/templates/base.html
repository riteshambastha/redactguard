<!-- RedactGuard | Author: Ritesh Ambastha -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RedactGuard{% endblock %}</title>
{% block extra_head %}{% endblock %}
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
  header h1 { font-size: 1.3rem; margin: 0; }
  header h1 a { text-decoration: none; color: inherit; }
  nav { display: flex; align-items: baseline; gap: 1rem; }
  nav form { display: inline; margin: 0; }
  nav button { padding: 0.2rem 0.6rem; }
  .card { border: 1px solid rgba(128,128,128,0.35); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .error { color: #c0392b; }
  .warn { color: #b8860b; }
  .muted { color: #888; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid rgba(128,128,128,0.25); }
  .status-queued { color: #888; }
  .status-running { color: #2980b9; }
  .status-done { color: #27ae60; }
  .status-failed { color: #c0392b; }
  form label { display: block; margin-top: 0.85rem; font-weight: 600; }
  input[type=email], input[type=password], input[type=file], select {
    width: 100%; padding: 0.45rem; margin-top: 0.3rem; box-sizing: border-box;
  }
  button[type=submit] { margin-top: 1.25rem; padding: 0.5rem 1.1rem; cursor: pointer; }
  pre.report { white-space: pre-wrap; background: rgba(128,128,128,0.08); padding: 0.75rem; border-radius: 6px; }
  footer { margin-top: 2.5rem; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<header>
  <h1><a href="/">RedactGuard</a></h1>
  <nav>
    {% if user %}
      <span class="muted">{{ user["email"] }}</span>
      <a href="/dashboard">Dashboard</a>
      <a href="/upload">New job</a>
      <form action="/logout" method="post"><button type="submit">Log out</button></form>
    {% else %}
      <a href="/login">Log in</a>
      <a href="/signup">Sign up</a>
    {% endif %}
  </nav>
</header>
{% block content %}{% endblock %}
<footer>
  RedactGuard — self-hosted, privacy-preserving video PII redaction.
  <a href="https://github.com/riteshambastha/redactguard">Source on GitHub</a>
</footer>
</body>
</html>
