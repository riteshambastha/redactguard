# Demo policy - face + text only, fully offline
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

version: 1
name: "demo_fast"
description: >
  Face + on-screen-text detection only. No model download required -
  the Haar/LBP face cascades ship with OpenCV and Tesseract OCR/MSER
  run entirely locally, so this profile works with zero internet
  access, which is why it's the webapp's default choice.

pii_types:
  face:
    enabled: true
  text:
    enabled: true
  audio:
    enabled: false   # see demo_with_audio.yaml - this profile stays fully offline

agreement_threshold: 2
custom_keywords: []

retry:
  max_attempts: 3
  escalation: "lower_threshold_and_widen_margin"
  on_unresolved: "warn"

