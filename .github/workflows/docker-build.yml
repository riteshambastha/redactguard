# RedactGuard Docker build
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

name: docker-build

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/**"

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f docker/Dockerfile -t redactguard:cpu .

