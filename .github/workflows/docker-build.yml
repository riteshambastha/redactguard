# RedactGuard Docker build
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

name: docker-build

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/**"

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f docker/Dockerfile -t redactguard:cpu .
      # A build that succeeds isn't proof the image actually works - this
      # repo's development sandbox can't reach any container registry at
      # all (see docs/adr/0010), so a real run-smoke-test only happens
      # here, in CI. Catches e.g. a missing apt package, a broken
      # ENTRYPOINT, or (the actual bug this smoke test would have caught)
      # policies/ never having been copied into the image.
      - name: Smoke test - --help runs
        run: docker run --rm redactguard:cpu --help
      - name: Smoke test - scan a real synthetic clip with the shipped policy
        # Bind-mounts only docker/smoke_test.sh (read-only) - the script
        # itself writes exclusively to /tmp *inside* the container, so
        # there's no host/container UID permission mismatch to worry
        # about from the USER redactguard switch in the Dockerfile.
        run: >
          docker run --rm
          -v "$PWD/docker/smoke_test.sh":/tmp/smoke_test.sh:ro
          --entrypoint sh redactguard:cpu /tmp/smoke_test.sh

  build-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only: standard GitHub-hosted runners have no GPU, so this
      # can't be run-smoke-tested the way the CPU image is above - see
      # docker/Dockerfile.gpu's own comments on the untested cuDNN
      # requirement. Still worth building on every push so a broken apt
      # package list or COPY path is caught immediately rather than on
      # whoever's own GPU machine first tries it.
      - name: Build GPU image
        run: docker build -f docker/Dockerfile.gpu -t redactguard:gpu .

