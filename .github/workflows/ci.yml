# RedactGuard CI
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        # actions/setup-python's interpreter and GitHub's ubuntu-latest
        # runner image do NOT include tesseract-ocr, and the pipeline's
        # OCR detector (packages/core/redactguard_core/detectors/text)
        # shells out to the real `tesseract` binary via pytesseract - not
        # a pip package alone. ffmpeg happens to already be preinstalled
        # on ubuntu-latest, but is listed explicitly anyway so this step
        # doesn't silently depend on that happening to remain true. These
        # are exactly the two packages docker/Dockerfile* already
        # apt-get installs for the same reason (see ADR-0010) - this was
        # simply never carried over to CI, which is why every run in this
        # workflow's history has failed on the OCR-dependent tests.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - name: Install
        run: |
          pip install -e packages/core -e packages/cli -e packages/plugin-sdk -e packages/webapp
          pip install -e packages/plugin-sdk/examples/example_tattoo_detector_plugin
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check packages
      - name: Type check
        run: mypy packages/core/redactguard_core packages/webapp/redactguard_webapp
      - name: Test
        run: |
          pytest packages/core/tests packages/cli/tests \
              packages/plugin-sdk/examples/example_tattoo_detector_plugin/tests \
              packages/webapp/tests -v

