# RedactGuard CI
#
# Part of RedactGuard - a self-hosted, privacy-preserving video PII
# redaction toolkit with ensemble detection and a closed-loop
# verify-then-retry guardrail.
#
# Author: Ritesh Ambastha

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e packages/core -e packages/cli -e packages/plugin-sdk
          pip install -e packages/plugin-sdk/examples/example_tattoo_detector_plugin
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check packages
      - name: Type check
        run: mypy packages/core/redactguard_core
      - name: Test
        run: pytest packages/core/tests packages/cli/tests packages/plugin-sdk/examples/example_tattoo_detector_plugin/tests -v

